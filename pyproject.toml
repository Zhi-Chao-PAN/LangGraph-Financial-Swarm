[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-financial-swarm"
version = "0.6.1"
description = "A hierarchical multi-agent system for financial analysis using LangGraph and local LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Zhi-Chao Pan"},
]
dependencies = [
    "langgraph>=0.0.26",
    "langchain>=0.2.14",
    "langchain_openai>=0.1.7",
    "langchain-community>=0.2.12",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.9.0",
    "pandas>=2.2.2",
    "llama-index>=0.10.55",
    "llama-index-embeddings-huggingface>=0.2.2",
    "llama-index-llms-ollama>=0.1.5",
    "sentence-transformers>=3.0.1",
    "rich>=13.7.1",
    "json5>=0.9.25",
    "diskcache>=5.6.3",
]

[project.optional-dependencies]
parse = ["llama-parse>=0.4.4"]
pdf = ["pymupdf>=1.24.0"]
dev = ["pytest>=7.0", "ruff>=0.4.0", "mypy>=1.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "strict"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = ["T201", "N806", "RET503", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"eval/expand_benchmark.py" = ["E501"]

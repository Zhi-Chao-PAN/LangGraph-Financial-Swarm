name: Multi-Agent System CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual triggers

jobs:
  scoring-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_evaluate_metrics.py -v

  code-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install analysis tools
      run: |
        pip install black==25.1.0 flake8==7.1.2 mypy==2.4.1 isort radon
    - name: Check formatting with black
      run: black --check --diff .
    - name: Lint with flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Type check with mypy
      run: mypy --ignore-missing-imports . --no-implicit-optional
    - name: Calculate code complexity
      run: |
        if [ -d "src" ]; then
          radon cc src/ -a -s
          radon mi src/ -s
        fi

  unit-tests:
    runs-on: ubuntu-latest
    needs: code-analysis
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e .
        pip install pytest pytest-cov pytest-asyncio pytest-mock
    - name: Run unit tests
      run: |
        echo "Running multi-agent system unit tests..."
        
        if [ -d "tests" ]; then
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=junit.xml \
            --asyncio-mode=auto
        else
          echo "No tests directory found, running basic checks"
          python -c "
          # Basic import and functionality tests
          import sys
          print('Python version:', sys.version)
          
          # Test core imports
          try:
              import asyncio
              print('AsyncIO: OK')
              
              # Test LangGraph availability
              try:
                  import langgraph
                  print('LangGraph: OK')
              except ImportError:
                  print('LangGraph: Not installed')
                  
          except Exception as e:
              print(f'Error: {e}')
              sys.exit(1)
          "
        fi
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          junit.xml
          coverage.xml
          htmlcov/

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      CI: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e .
        pip install pytest pytest-asyncio
    - name: Run offline integration tests
      run: python -m pytest tests/test_integration.py -v --tb=short

  agent-validation:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e .
    - name: Run the scripted offline graph with real chart export
      env:
        CI: "true"
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
        OUTPUT_DIR: output/demo
      run: python main.py --demo --json > offline-demo.json
    - name: Upload synthetic demo trace and chart data
      uses: actions/upload-artifact@v4
      with:
        name: offline-graph-demo
        path: |
          offline-demo.json
          output/demo/

  documentation-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [code-analysis, unit-tests, agent-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install documentation tools
      run: |
        pip install mkdocs-material pymdown-extensions mkdocs-autorefs
    - name: Build multi-agent documentation
      run: |
        # Create documentation structure
        mkdir -p docs
        
        # Create main documentation
        cat > docs/index.md << 'EOF'
        # LangGraph Financial Swarm
        
        ## Overview
        A prototype multi-agent system for financial analysis. Historical model-performance claims are unverified; see the repository README for evaluation scope.
        
        ## Architecture
        - **Supervisor Agent**: Orchestrates workflow
        - **Researcher Agent**: Performs structure-aware retrieval
        - **Quant Agent**: Executes financial analysis
        
        ## Performance
        | Metric | Value |
        |--------|-------|
        | Answer quality | Not remeasured |
        | Hallucination rate | Not remeasured |
        | Latency | Not remeasured |
        
        ## Quick Start
        ```bash
        git clone https://github.com/Zhi-Chao-PAN/LangGraph-Financial-Swarm.git
        cd LangGraph-Financial-Swarm
        pip install -e .
        python main.py --query "Analyze Apple's revenue trend"
        ```
        
        ## Citation
        ```bibtex
        @software{langgraph_financial_swarm,
          author = {Zhi-Chao Pan},
          title = {LangGraph Financial Swarm: Heterogeneous Agent Orchestration},
          year = {2026},
          url = {https://github.com/Zhi-Chao-PAN/LangGraph-Financial-Swarm}
        }
        ```
        EOF
        
        # Build documentation
        if [ ! -f "mkdocs.yml" ]; then
          cat > mkdocs.yml << 'EOF'
        site_name: Financial Swarm Documentation
        theme:
          name: material
        nav:
          - Home: index.md
          - Architecture: architecture.md
          - API Reference: api.md
          - Examples: examples.md
        EOF
        fi
        
        mkdocs build --site-dir site
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        keep_files: false

  security-audit:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
    - name: Run security scans
      run: |
        echo "Running security audit for multi-agent system..."
        
        # Check for hardcoded secrets
        echo "Checking for potential secrets..."
        grep -r -E "(api[_-]?key|secret|password|token|auth)" --include="*.py" --include="*.env" --include="*.yaml" --include="*.json" . | grep -v ".git" | grep -v "test_" || true
        
        # Check dependency security
        pip install safety
        safety check --full-report || true

  system-health:
    runs-on: ubuntu-latest
    needs: [code-analysis, unit-tests, agent-validation, integration-tests, scoring-regressions]
    if: always()
    steps:
      - name: Require all offline quality checks to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYCODE'
          import json, os, sys
          results = json.loads(os.environ["CHECK_RESULTS"])
          print(json.dumps({name: value["result"] for name, value in results.items()}, indent=2))
          sys.exit(any(value["result"] != "success" for value in results.values()))
          PYCODE
